name: Deploy Staging & Cloudflare Workers Preview

on:
  push:
    branches:
      - stg
  pull_request:
    branches:
      - stg
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  deployments: write
  pull-requests: write

jobs:
  deploy-preview:
    name: Deploy to Cloudflare Workers Preview (stg)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check project & Cloudflare credentials readiness
        id: readiness
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ ! -f "package.json" ] || [ ! -f "wrangler.jsonc" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "reason=package.json or wrangler.jsonc not yet present (awaiting Task 1.1 merge)." >> "$GITHUB_OUTPUT"
          elif [ -z "$CF_TOKEN" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "reason=CLOUDFLARE_API_TOKEN secret is not configured in GitHub repository settings yet." >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Notice when skipped
        if: steps.readiness.outputs.ready == 'false'
        run: |
          echo "### ℹ️ Cloudflare Workers Preview Deployment Skipped" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Reason**: ${{ steps.readiness.outputs.reason }}" >> "$GITHUB_STEP_SUMMARY"

      - name: Setup Node.js
        if: steps.readiness.outputs.ready == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        if: steps.readiness.outputs.ready == 'true'
        run: npm ci

      - name: Build application
        if: steps.readiness.outputs.ready == 'true'
        run: npm run build

      - name: Upload Preview Version & Deploy Staging Worker
        id: cf_preview
        if: steps.readiness.outputs.ready == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -e
          echo "Uploading Cloudflare Workers Preview version (alias: stg)..."
          OUTPUT=$(npx wrangler versions upload --preview-alias stg 2>&1 | tee /dev/stderr)

          PREVIEW_URL=$(echo "$OUTPUT" | grep -Eo 'https://[a-zA-Z0-9._-]+\.workers\.dev' | tail -n 1 || true)
          ALIAS_URL=$(echo "$OUTPUT" | grep -Eo 'https://stg-[a-zA-Z0-9._-]+\.workers\.dev' | head -n 1 || true)

          if [ -z "$PREVIEW_URL" ]; then
            echo "Falling back to staging environment deploy..."
            STG_OUT=$(npx wrangler deploy --env staging 2>&1 | tee /dev/stderr)
            PREVIEW_URL=$(echo "$STG_OUT" | grep -Eo 'https://[a-zA-Z0-9._-]+\.workers\.dev' | tail -n 1 || true)
          fi

          echo "preview_url=${PREVIEW_URL}" >> "$GITHUB_OUTPUT"
          echo "alias_url=${ALIAS_URL:-$PREVIEW_URL}" >> "$GITHUB_OUTPUT"

          echo "### 🚀 Cloudflare Workers Preview Deployed (stg)" >> "$GITHUB_STEP_SUMMARY"
          echo "| 種別 | URL |" >> "$GITHUB_STEP_SUMMARY"
          echo "| :--- | :--- |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Preview Alias URL (stg)** | ${ALIAS_URL:-$PREVIEW_URL} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Version Preview URL** | ${PREVIEW_URL} |" >> "$GITHUB_STEP_SUMMARY"

      - name: Comment Preview URL on Pull Request
        if: steps.readiness.outputs.ready == 'true' && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const previewUrl = '${{ steps.cf_preview.outputs.preview_url }}';
            const aliasUrl = '${{ steps.cf_preview.outputs.alias_url }}';
            const marker = '<!-- cloudflare-workers-preview-comment -->';
            const body = `${marker}
            ### 🚀 Cloudflare Workers Preview URL (stg)
            ステージング／プレビュー環境へのビルド・デプロイが完了しました！スマホ画面幅（320px〜430px）での動作確認にご利用ください。

            | 環境 | Preview URL | Commit |
            | :--- | :--- | :--- |
            | **Staging Alias (`stg`)** | ${aliasUrl || 'N/A'} | \`${context.sha.slice(0, 7)}\` |
            | **Immutable Version Preview** | ${previewUrl || 'N/A'} | \`${context.sha.slice(0, 7)}\` |
            `;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
