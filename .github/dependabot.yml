version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    target-branch: "Development"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "enhancement"

  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "Development"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
